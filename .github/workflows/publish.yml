# Publishes to npm via trusted publishing (OIDC). No NPM_TOKEN, no OTP.
#
# One-time prerequisite on npmjs.com (already done):
#   @vinihcrosa/gitlab-mcp -> Settings -> Trusted publishing -> GitHub Actions
#     Organization or user: vinihcrosa
#     Repository:           gitlab-mcp
#     Workflow filename:    publish.yml
#
# npm only allows configuring this after the package exists in the registry, so
# the first publish (0.1.0) had to go out another way (token with Bypass 2FA or
# OTP). Everything from 0.1.1 on ships through this workflow.
#
# Triggers: publishing a GitHub release, or a manual run from the Actions tab.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required by trusted publishing's OIDC exchange
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires npm >= 11.5.1. Node 24 already bundles
          # npm 11.x, so there is no need to install npm globally.
          # Do not add `npm install -g npm@latest`: npm 12 requires Node
          # ^22.22.2 || ^24.15.0 || >=26 and breaks on an older pinned Node.
          node-version: '24'
          # Do NOT set `registry-url` here. It makes setup-node write an .npmrc
          # containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
          # and with no NPM_TOKEN secret that variable holds setup-node's
          # literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX`. npm then believes it
          # already has a credential, never attempts the OIDC exchange, and the
          # registry rejects the garbage token as a 404.
          # registry.npmjs.org is the default anyway, and
          # `publishConfig.access: public` in package.json covers the rest.

      - name: Versions (trusted publishing requires npm >= 11.5.1)
        run: node --version && npm --version

      - run: npm ci

      - run: npm run build

      - run: npm test

      # With no NPM_TOKEN present, npm detects the OIDC environment and
      # authenticates on its own. A signed provenance statement in the log is
      # the proof that this path was taken.
      - name: Publish
        run: npm publish
